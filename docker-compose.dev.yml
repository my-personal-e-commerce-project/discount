services:
  postgres:
    image: debezium/postgres:16
    container_name: discount-postgres-1
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=discounts
    networks:
      - e-commerce-network
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
# =========================================================================
# Para registrar el conector manualmente, ejecutá este comando en tu terminal:
# 
# curl -i -X PUT -H "Accept:application/json" -H "Content-Type:application/json" \
#  localhost:8083/connectors/discount-connector/config -d '{
#    "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
#    "database.hostname": "discount-postgres-1",
#    "database.port": "5432",
#    "database.user": "root",
#    "database.password": "root",
#    "database.dbname": "discounts",
#    "topic.prefix": "discount",
#    "table.include.list": "public.outbox",
#    "plugin.name": "pgoutput",
#    "value.converter": "org.apache.kafka.connect.json.JsonConverter",
#    "value.converter.schemas.enable": "false",
#    "key.converter": "org.apache.kafka.connect.json.JsonConverter",
#    "key.converter.schemas.enable": "false"
#  }'
# Para verificar el estado del conector:
# curl -s localhost:8083/connectors/mi-conector-postgres/status | jq
# =========================================================================
  connect:
    image: quay.io/debezium/connect:2.5
    depends_on:
      - postgres
    ports:
      - "8083:8083"
    networks:
      - e-commerce-network
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
networks:
  e-commerce-network:
    external: true
volumes:
  pgsql_data:
    name: discount_final_volume
