services:
  postgres:
    image: debezium/postgres:16
    container_name: discount-postgres-1
    ports:
      - 5434:5432
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=discounts
    networks:
      - e-commerce-network
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
