# Para verificar el estado del conector:
# curl -s localhost:8084/connectors/mi-conector-postgres/status | jq
# =========================================================================
  connect:
    image: quay.io/debezium/connect:2.5
    depends_on:
      - postgres
    ports:
      - "8084:8083"
    networks:
      - e-commerce-network
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
networks:
  e-commerce-network:
    external: true
volumes:
  pgsql_data:
    name: discount_final_volume
